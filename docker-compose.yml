version: '3.8'

services:
  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: prado_verde_backend
    restart: always
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      JWT_SECRET: ${JWT_SECRET:-prado_verde_jwt_secret_key_prod_2026_super_secure}
    expose:
      - "3000"

  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
    container_name: prado_verde_frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
