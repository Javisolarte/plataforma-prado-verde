<div class="login-wrapper">
  
  <div class="login-side presentation-side">
    <div class="brand">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" style="width: 100%; height: 100%;">
          <rect x="5" y="5" width="90" height="90" rx="22" fill="#FFFFFF" />
          <rect x="22" y="38" width="22" height="42" rx="3" fill="#10B981" />
          <rect x="27" y="44" width="5" height="5" rx="1" fill="#FFFFFF" />
          <rect x="34" y="44" width="5" height="5" rx="1" fill="#FFFFFF" />
          <rect x="27" y="53" width="5" height="5" rx="1" fill="#FFFFFF" />
          <rect x="34" y="53" width="5" height="5" rx="1" fill="#FFFFFF" />
          <rect x="48" y="22" width="30" height="58" rx="4" fill="#047857" />
          <rect x="54" y="28" width="6" height="6" rx="1" fill="#A7F3D0" />
          <rect x="64" y="28" width="6" height="6" rx="1" fill="#A7F3D0" />
          <rect x="54" y="38" width="6" height="6" rx="1" fill="#A7F3D0" />
          <rect x="64" y="38" width="6" height="6" rx="1" fill="#A7F3D0" />
          <rect x="54" y="48" width="6" height="6" rx="1" fill="#A7F3D0" />
          <rect x="64" y="48" width="6" height="6" rx="1" fill="#A7F3D0" />
          <rect x="59" y="68" width="8" height="12" rx="1.5" fill="#34D399" />
        </svg>
      </div>
      <h1>Prado Verde</h1>
    </div>
    <h2>Gestión Administrativa <br>Inteligente y Segura</h2>
    <p>Plataforma exclusiva para Superusuarios y Administradores de Conjuntos Residenciales.</p>
  </div>

  <div class="login-side form-side">
    <div class="glass-panel form-container">
      <h3>Bienvenido de nuevo</h3>
      <p class="subtitle">Ingresa tus credenciales para continuar</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        
        <div class="input-group">
          <label class="input-label" for="email">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            class="input-field" 
            formControlName="email" 
            placeholder="admin@prado.com"
          >
        </div>

        <div class="input-group">
          <label class="input-label" for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            class="input-field" 
            formControlName="password" 
            placeholder="••••••••"
          >
        </div>

        <div *ngIf="errorMessage" class="error-alert">
          {{ errorMessage }}
        </div>

        <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || isLoading">
          {{ isLoading ? 'Ingresando...' : 'Iniciar Sesión' }}
        </button>

      </form>
    </div>
  </div>
</div>
