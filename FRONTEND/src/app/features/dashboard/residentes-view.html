      <!-- VISTA RESIDENTES -->
      <ng-container *ngIf="view === 'residentes'">
        <div class="crud-container">
          <div class="crud-header"><h2>Gestión de Residentes</h2></div>
          <table class="modern-table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Apartamentos</th>
                <th>Cuenta Acceso</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let r of residentes()">
                <td><strong>{{ r.nombre }}</strong></td>
                <td>{{ r.telefono || 'N/A' }}</td>
                <td>
                  <span *ngFor="let apt of r.apartamentos" class="badge" style="background:#E5E7EB; color:#374151; margin-right:4px;">
                    {{ apt.apartamento.numero }} ({{ apt.tipo }})
                  </span>
                </td>
                <td>
                  <span class="badge" [ngClass]="{'bg-green-100 text-green-800': r.usuarioId, 'bg-gray-100 text-gray-800': !r.usuarioId}">
                    {{ r.usuario ? r.usuario.email : 'Sin Cuenta' }}
                  </span>
                </td>
                <td>
                  <div class="table-actions">
                    <button *ngIf="!r.usuarioId" class="btn-action primary" (click)="openGenerateAccount(r.id)" style="background:#10B981; color:white; border-color:#10B981;">Crear Cuenta</button>
                    <button class="btn-action edit" (click)="openModal('residente', r)">Editar</button>
                    <button class="btn-action delete" (click)="deleteResidente(r.id)">Eliminar</button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </ng-container>
